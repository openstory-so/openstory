<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stitch</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #171717;
        color: #f5f5f5;
        font: 16px/1.4 sans-serif;
      }
      #root {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        container-type: size;
      }
      #stage {
        position: relative;
        /* --ar is width / height, written from /cut.json before React mounts. */
        width: min(100cqw, calc(100cqh * var(--ar)));
        height: min(100cqh, calc(100cqw / var(--ar)));
        aspect-ratio: var(--ar);
        overflow: hidden;
        border-radius: 12px;
        background: #000;
        box-shadow: 0 18px 50px rgb(0 0 0 / 0.45);
      }
      #stage > * {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="stage"></div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
