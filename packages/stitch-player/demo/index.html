<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stitch player demo</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #171717;
      }
      #root {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
      }
      #stage {
        position: relative;
        width: min(960px, 100%);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
        box-shadow: 0 18px 50px rgb(0 0 0 / 0.45);
      }
      #stage > * {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="stage"></div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
