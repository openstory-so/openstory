name: Publish stitch-player

# Publishes packages/stitch-player to npm as @openstory/stitch-player when a
# `stitch-player-v*` tag is pushed. The tag must match the package version.
# Needs the `NPM_TOKEN` repository secret (an npm granular token with publish
# rights on the @openstory org), or configure npm trusted publishing for this
# workflow and drop the token.

on:
  push:
    tags:
      - 'stitch-player-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/stitch-player/package.json').version")
          tag="${GITHUB_REF_NAME#stitch-player-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Test
        run: bun run test packages/stitch-player

      - name: Build
        run: bun run --cwd packages/stitch-player build

      - name: Publish
        working-directory: packages/stitch-player
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
