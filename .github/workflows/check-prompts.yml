name: Check Prompts

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/prompts/**'
      - 'scripts/upload-all-prompts.ts'
      - 'scripts/check-prompts.ts'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/prompts/**'
      - 'scripts/upload-all-prompts.ts'
      - 'scripts/check-prompts.ts'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: check-prompts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR: check and report ──────────────────────────────────────────
  check-prompts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Check prompts against Langfuse
        id: check
        run: |
          output=$(bun --bun scripts/check-prompts.ts --json 2>&1) || true
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

      - name: Build PR comment
        id: comment-body
        env:
          CHECK_RESULT: ${{ steps.check.outputs.result }}
        run: |
          node -e "
            const raw = process.env.CHECK_RESULT;
            const fs = require('fs');
            const out = process.env.GITHUB_OUTPUT;

            let data;
            try { data = JSON.parse(raw); } catch {
              fs.appendFileSync(out, 'body<<EOFCOMMENT\n<!-- check-prompts -->\n**Prompt Sync Check**\n\nFailed to parse results.\n\`\`\`\n' + raw + '\n\`\`\`\nEOFCOMMENT\n');
              process.exit(0);
            }

            const lines = ['<!-- check-prompts -->', '**Prompt Sync Check**', ''];

            if (data.inSync) {
              lines.push('All prompts are in sync with Langfuse.');
            } else {
              lines.push('| Status | Type | Prompt |');
              lines.push('|--------|------|--------|');
              for (const p of data.modified || [])
                lines.push('| Modified | ' + p.type + ' | \`' + p.name + '\` |');
              for (const p of data.new || [])
                lines.push('| New (local only) | ' + p.type + ' | \`' + p.name + '\` |');
              for (const p of data.removed || [])
                lines.push('| Removed (Langfuse only) | ' + p.type + ' | \`' + p.name + '\` |');
              for (const e of data.errors || [])
                lines.push('| Error | ? | \`' + e.name + '\`: ' + e.error + ' |');
              lines.push('');
              lines.push('> These prompts will be synced to Langfuse when this PR is merged to main.');
            }

            fs.appendFileSync(out, 'body<<EOFCOMMENT\n' + lines.join('\n') + '\nEOFCOMMENT\n');
          "

      - name: Find existing PR comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- check-prompts -->'

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.comment-body.outputs.body }}

  # ── Main: sync prompts to Langfuse ────────────────────────────────
  sync-prompts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Upload prompts to Langfuse
        run: bun upload:prompts
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
