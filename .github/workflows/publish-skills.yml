name: Publish skills

# Publishes the skills to openstory-so/skills (#2357): scripts/publish-skills.ts.
# Nobody edits that repo's skills/ by hand.
# Needs: secret SKILLS_REPO_TOKEN (fine-grained, openstory-so/skills,
# contents + pull requests write), and "Allow auto-merge" on that repo.
# Runs after Test passes on a push to main, on the commit Test ran on, or by
# hand (Run workflow) to catch up after a red Test.

# Only a push to this repo's main runs it (the job's if), so no fork code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-skills
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openstory-so/skills
          path: plugin
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Open the sync pull request
        env:
          GH_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bun scripts/publish-skills.ts
