name: Deploy Cloudflare

# PR previews only. Production deploys to `main` run on Cloudflare Workers
# Builds (dashboard-connected, wrangler-authenticated — no Cloudflare secrets
# in GitHub for the prod path): build command `bun run build` with
# CLOUDFLARE_ENV=production, deploy command `bun run deploy:production`.
# See docs/deployment/cloudflare.md and issue #900. Previews stay here
# because Workers Builds branch previews share production bindings — no
# per-PR D1 provisioning, no workflow-name namespacing (#805), no teardown.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: cf-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-cf-token: ${{ steps.check.outputs.has-cf-token }}
    steps:
      - id: check
        run: echo "has-cf-token=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

  # ── PR preview deploy ─────────────────────────────────────────────
  deploy-preview:
    needs: check-secrets
    if: >-
      needs.check-secrets.outputs.has-cf-token == 'true'
      && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Create or find D1 database
        id: d1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DB_NAME="openstory-pr-${PR_NUMBER}"

          # Check if database already exists
          list_response=$(curl -s \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database?name=$DB_NAME")

          existing=$(echo "$list_response" | jq -r '.result[0].uuid // empty')

          if [ -n "$existing" ]; then
            echo "Found existing D1 database: $existing"
            echo "database-id=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "Creating new D1 database: $DB_NAME"
            result=$(curl -s \
              -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$DB_NAME\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database")

            success=$(echo "$result" | jq -r '.success')
            if [ "$success" != "true" ]; then
              echo "::error::Failed to create D1 database: $result"
              exit 1
            fi

            uuid=$(echo "$result" | jq -r '.result.uuid')
            echo "Created D1 database: $uuid"
            echo "database-id=$uuid" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch wrangler config for preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database-id }}
        run: |
          node -e "
            const fs = require('fs');
            let cfg = fs.readFileSync('wrangler.jsonc', 'utf8');
            cfg = cfg.replace(/\/\/.*$/gm, '').replace(/,(\s*[}\]])/g, '\$1');
            const obj = JSON.parse(cfg);
            obj.name = 'pr-${PR_NUMBER}';
            obj.d1_databases = [{
              binding: 'DB',
              database_name: 'openstory-pr-${PR_NUMBER}',
              database_id: '${D1_DATABASE_ID}',
              migrations_dir: 'drizzle/migrations-wrangler'
            }];
            obj.r2_buckets = [
              { bucket_name: 'openstory-public-assets', binding: 'R2_PUBLIC_ASSETS_BUCKET', remote: true },
              { binding: 'R2_STORAGE_BUCKET', bucket_name: 'openstory-storage-stg' }
            ];
            // Cloudflare Workflows are account-global resources keyed by 'name'
            // — NOT scoped per worker. Without this, a preview's workflow
            // entries reuse production's names (image-workflow, …), so
            // triggerWorkflow() -> binding.create() resolves to the shared,
            // production-owned workflow (prod code + prod D1 + prod realtime
            // DO) and a preview deploy can last-writer-wins re-point ownership
            // onto the preview worker, breaking prod. Namespace the name per-PR
            // (keep binding + class_name so TRIGGER_TO_BINDING still resolves)
            // so each preview owns an isolated set. See issue #805.
            obj.workflows = (obj.workflows || []).map((w) => ({
              ...w,
              name: \`\${w.name}-pr-${PR_NUMBER}\`,
            }));
            // Server-side video export container (#968). Production declares
            // the container, its VIDEO_EXPORT_CONTAINER DO binding, and the v2
            // migration tag in [env.production] ONLY (so 'bun dev' / hermetic
            // e2e stay Docker-free). Mirror that full wiring onto the preview's
            // default block so previews render exports for real, exactly like
            // prod. Each preview is its own worker with independent DO
            // migration history, so v1 (RealtimeChannel) + v2
            // (VideoExportContainer) both apply to a fresh preview worker. The
            // image is built from the Dockerfile during 'wrangler deploy' (the
            // CI runner has Docker). See containers/video-export and
            // src/lib/containers/video-export-container.ts.
            obj.containers = [
              {
                class_name: 'VideoExportContainer',
                image: './containers/video-export/Dockerfile',
                instance_type: 'standard',
                max_instances: 3
              }
            ];
            obj.durable_objects = obj.durable_objects || { bindings: [] };
            obj.durable_objects.bindings = [
              ...(obj.durable_objects.bindings || []),
              { name: 'VIDEO_EXPORT_CONTAINER', class_name: 'VideoExportContainer' }
            ];
            obj.migrations = [
              ...(obj.migrations || []),
              { tag: 'v2', new_sqlite_classes: ['VideoExportContainer'] }
            ];
            // Tail-consume preview logs into the staging log forwarder
            // (workers/posthog-log-forwarder), which transforms our LogTape
            // JSON into proper OTLP log records and POSTs to PostHog. The
            // forwarder must be deployed as 'openstory-log-forwarder-stg'
            // before preview deploys can reference it. See PR #765 /
            // issue #754 / workers/posthog-log-forwarder/README.md.
            obj.tail_consumers = [{ service: 'openstory-log-forwarder-stg' }];
            // NOTE: triggers.crons retained on previews so the reconciler
            // sweep can be tested end-to-end. Each preview has its own
            // isolated D1, so the sweep operates on preview rows only. See
            // issue #727 / PR #730.
            fs.writeFileSync('wrangler.jsonc', JSON.stringify(obj, null, 2));
          "
          echo "Patched wrangler.jsonc:"
          cat wrangler.jsonc | head -30

      # Runs after the patch so wrangler resolves the PR's own D1 (the
      # binding's database_id was just rewritten). Seeding happens at
      # runtime via the worker's self-seed (src/server.ts). See #897.
      - name: Migrate D1 (preview)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun scripts/flatten-migrations.ts
          bunx wrangler d1 migrations apply DB --remote

      - name: Build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          # Baked into sheet/preview URLs by the runtime self-seed
          # (import.meta.env, build-time).
          VITE_R2_PUBLIC_ASSETS_DOMAIN: ${{ vars.VITE_R2_PUBLIC_ASSETS_DOMAIN }}
        run: |
          bunx wrangler types
          bun run build

      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          output=$(bunx wrangler deploy 2>&1) || true
          echo "$output"
          url=$(echo "$output" | grep -oP 'https://[^\s]+\.workers\.dev' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Wrangler deploy failed — no URL found in output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Push secrets to preview worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECRET_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SECRET_API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY }}
          SECRET_VITE_APP_NAME: ${{ vars.APP_NAME }}
          SECRET_VITE_APP_URL: ${{ steps.deploy.outputs.url }}
          SECRET_BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SECRET_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SECRET_FAL_KEY: ${{ secrets.FAL_KEY }}
          # GOOGLE_CLIENT_ID/SECRET deliberately not pushed: preview hosts
          # have no registered OAuth redirect URIs, and absence of the
          # secrets is what hides Google sign-in (isGoogleAuthConfigured).
          SECRET_OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          # Absent → Grok/Gemini fall back to OpenRouter/fal on previews
          # (#1167 / native Google). Staging has both; empty values are
          # stripped by the jq filter below.
          SECRET_XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_VITE_R2_PUBLIC_ASSETS_DOMAIN: ${{ vars.VITE_R2_PUBLIC_ASSETS_DOMAIN }}
          SECRET_R2_PUBLIC_STORAGE_DOMAIN: ${{ vars.R2_PUBLIC_STORAGE_DOMAIN }}
          SECRET_VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          SECRET_VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
        run: |
          # Build JSON from SECRET_* env vars, stripping empty values
          jq -n 'env | with_entries(select(.key | startswith("SECRET_"))) | with_entries(.key |= ltrimstr("SECRET_")) | with_entries(select(.value != ""))' \
            | bunx wrangler secret bulk --name "pr-${PR_NUMBER}"

      - name: Find existing PR comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- cf-preview -->'

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- cf-preview -->
            **Cloudflare Preview** deployed successfully

            | | |
            |---|---|
            | URL | ${{ steps.deploy.outputs.url }} |
            | Worker | `pr-${{ github.event.pull_request.number }}` |
            | D1 Database | `openstory-pr-${{ github.event.pull_request.number }}` |
            | Commit | ${{ github.sha }} |

  # ── Cleanup on PR close ───────────────────────────────────────────
  cleanup-preview:
    needs: check-secrets
    if: >-
      needs.check-secrets.outputs.has-cf-token == 'true'
      && github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Delete worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WORKER_NAME="pr-${PR_NUMBER}"
          status=$(curl -sw '%{http_code}' -o /dev/null \
            -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER_NAME")
          echo "Delete worker $WORKER_NAME response: $status"

      - name: Delete preview workflows
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Workflows are account-global resources (see issue #805), so the
          # preview's namespaced set (`<name>-pr-<n>`) survives the worker
          # delete above. Sweep them by exact `-pr-<n>` suffix so the account
          # doesn't accumulate orphaned `*-pr-<n>` workflow definitions.
          SUFFIX="-pr-${PR_NUMBER}"
          page=1
          deleted=0
          while :; do
            resp=$(curl -sf \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workflows?per_page=100&page=$page") || {
                echo "::warning::Failed to list workflows (page $page) — skipping workflow cleanup"
                break
              }

            names=$(echo "$resp" | jq -r --arg sfx "$SUFFIX" '.result[]?.name | select(endswith($sfx))')

            for name in $names; do
              status=$(curl -sw '%{http_code}' -o /dev/null \
                -X DELETE \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workflows/$name")
              echo "Delete workflow $name response: $status"
              deleted=$((deleted + 1))
            done

            count=$(echo "$resp" | jq -r '.result | length')
            total_pages=$(echo "$resp" | jq -r '.result_info.total_pages // 1')
            if [ "$count" -eq 0 ] || [ "$page" -ge "$total_pages" ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Deleted $deleted preview workflow(s) with suffix $SUFFIX"

      # Container applications are account-level resources tied to a worker's
      # DO namespace — they outlive the worker delete above. Leaving them
      # blocks reopened/redeployed PRs ("already an application with the name
      # pr-<n>-videoexportcontainer … associated with a different durable
      # object namespace") and accrues provisioned instances. See #1052.
      - name: Delete container application
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Naming: wrangler deploys the container as `<worker>-<class>` lowercased
          # — worker is `pr-<n>`, class is VideoExportContainer →
          # `pr-<n>-videoexportcontainer`. Same list-then-delete pattern as
          # workflows; tolerate not-found (PRs that never got a container).
          APP_NAME="pr-${PR_NUMBER}-videoexportcontainer"
          resp=$(curl -sf \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/containers/applications?name=$APP_NAME") || {
              echo "::warning::Failed to list container applications — skipping container cleanup"
              exit 0
            }

          # Response may be a bare array (Cloudchamber OpenAPI) or the usual
          # `{ success, result: [...] }` envelope — accept both.
          ids=$(echo "$resp" | jq -r '
            if type == "array" then .[]?.id
            elif .result | type == "array" then .result[]?.id
            else empty
            end
          ')

          if [ -z "$ids" ]; then
            echo "Container application $APP_NAME not found (already deleted or never deployed)"
            exit 0
          fi

          for id in $ids; do
            status=$(curl -sw '%{http_code}' -o /dev/null \
              -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/containers/applications/$id")
            echo "Delete container application $APP_NAME ($id) response: $status"
          done

      - name: Delete D1 database
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DB_NAME="openstory-pr-${PR_NUMBER}"

          # Find database ID by name
          uuid=$(curl -sf \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database?name=$DB_NAME" \
            | jq -r '.result[0].uuid // empty')

          if [ -n "$uuid" ]; then
            status=$(curl -sw '%{http_code}' -o /dev/null \
              -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$uuid")
            echo "Delete D1 database $DB_NAME ($uuid) response: $status"
          else
            echo "D1 database $DB_NAME not found (already deleted?)"
          fi

      - name: Find existing PR comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- cf-preview -->'

      - name: Update PR comment
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- cf-preview -->
            **Cloudflare Preview** torn down

            Worker `pr-${{ github.event.pull_request.number }}`, D1 database `openstory-pr-${{ github.event.pull_request.number }}`, preview workflows, and container application `pr-${{ github.event.pull_request.number }}-videoexportcontainer` have been deleted.
