name: Gateway coverage

# Weekly: can the gateway still hold every product model from its live card (#2432)?
# Fails on a gap model-gateway.md does not list, or a card that moved from the recorded fixture.
# Needs the MODELSCHEMAS_API_KEY repository secret (anonymous is 60 requests an hour).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check coverage against live modelschemas
        env:
          MODELSCHEMAS_API_KEY: ${{ secrets.MODELSCHEMAS_API_KEY }}
        run: bun scripts/check-gateway-coverage.ts --drift
